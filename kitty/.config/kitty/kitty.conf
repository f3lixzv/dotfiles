# Font Settings
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window Opacity & Padding
background_opacity 0.70
background_blur    1
window_padding_width 12

# Terminal Bell & Cursor
enable_audio_bell no
cursor           #d0d0d0
cursor_text_color #1a1a1a
cursor_shape     block

# Color Scheme (Monochrome / Muted Dark)
foreground       #d0d0d0
background       #18181a
selection_foreground #18181a
selection_background #d0d0d0

# Black
color0 #262626
color8 #4e4e4e

# Red / Muted Dark Gray-Red
color1 #8a7b7c
color9 #a08f90

# Green / Muted Sage
color2 #7c8a7b
color10 #8fa08f

# Yellow / Warm Gray
color3 #a0988e
color11 #b8b0a5

# Blue / Slate Gray
color4 #6f7a82
color12 #83909a

# Magenta / Muted Ash
color5 #8e808e
color13 #a494a4

# Cyan / Cold Gray
color6 #728484
color14 #879b9b

# White
color7 #b0b0b0
color15 #e0e0e0
